<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Logic Simulator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .qubit-line { height: 2px; background: #334155; position: absolute; left: 0; right: 0; top: 50%; z-index: 0; pointer-events: none; }
        .gate-btn { transition: all 0.2s; cursor: grab; }
        .gate-row { transition: background-color 0.2s; border-radius: 0.5rem; min-height: 40px; }
        .gate-row.drag-over { background-color: rgba(56, 189, 248, 0.2); outline: 2px dashed #38bdf8; }
        .phase-disk { border: 1px solid #475569; border-radius: 50%; position: relative; background: #1e293b; display: flex; align-items: center; justify-content: center; }
        .phase-needle { position: absolute; top: 50%; left: 50%; width: 50%; height: 2px; background: #38bdf8; transform-origin: left center; z-index: 10; }
        .phase-fill { position: absolute; border-radius: 50%; background: rgba(56, 189, 248, 0.3); }
        .active-gate { outline: 3px solid #38bdf8; outline-offset: 2px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        
        .hinton-wrapper { display: inline-grid; grid-template-areas: ". top" "left main"; gap: 4px; padding: 10px; background: #020617; border-radius: 8px; border: 1px solid #1e293b; }
        .hinton-top-labels { grid-area: top; display: flex; }
        .hinton-left-labels { grid-area: left; display: flex; flex-direction: column; }
        .hinton-grid { grid-area: main; display: grid; grid-template-columns: repeat(16, 18px); grid-template-rows: repeat(16, 18px); gap: 1px; border: 1px solid #334155; }
        .hinton-label { font-size: 7px; font-family: monospace; color: #64748b; display: flex; align-items: center; justify-content: center; }
        .hinton-label.row { width: 30px; height: 18px; justify-content: flex-end; padding-right: 4px; }
        .hinton-label.col { width: 18px; height: 20px; writing-mode: vertical-rl; transform: rotate(180deg); }

        .bracket-container { display: flex; align-items: stretch; position: relative; }
        .bracket-left { border-left: 3px solid #94a3b8; border-top: 3px solid #94a3b8; border-bottom: 3px solid #94a3b8; width: 10px; margin-right: 4px; border-radius: 4px 0 0 4px; }
        .bracket-right { border-right: 3px solid #94a3b8; border-top: 3px solid #94a3b8; border-bottom: 3px solid #94a3b8; width: 10px; margin-left: 4px; border-radius: 0 4px 4px 0; }
        
        .matrix-scroll-wrapper { max-height: 400px; overflow: auto; border: 1px solid #1e293b; border-radius: 4px; }
        .matrix-grid { display: grid; grid-template-columns: repeat(16, minmax(45px, 1fr)); background: #020617; }
        .matrix-cell { font-size: 10px; padding: 6px 2px; text-align: center; border: 0.5px solid #1e293b; font-family: monospace; }
        
        .tab-btn { border-bottom: 2px solid transparent; opacity: 0.6; }
        .tab-btn.active { border-color: #38bdf8; color: #38bdf8; opacity: 1; }

        .insight-card { border-left: 4px solid #38bdf8; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-2 sm:p-4">
    <div id="app" class="max-w-[1600px] mx-auto">
        <header class="mb-4 border-b border-slate-700 pb-2 flex flex-wrap justify-between items-center gap-4">

                <h1 class="text-xl font-bold text-sky-400">Quantum Multi-View Simulator</h1>

                    <button onclick="switchTab('qsphere')" id="tab-qsphere" class="tab-btn px-2 py-1 transition">Q-Sphere</button>
                    <button onclick="switchTab('hinton')" id="tab-hinton" class="tab-btn px-2 py-1 transition">Hinton & Polytopes</button>
                    <button onclick="switchTab('matrix')" id="tab-matrix" class="tab-btn px-2 py-1 transition">Matrices</button>
                </nav>
            </div>
            
            <div class="flex gap-2 bg-slate-800 p-1.5 rounded-lg border border-slate-700">
                <button onclick="stepBack()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-[10px] transition">Back</button>
                <button onclick="resetStep()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-[10px] transition">Start</button>
                <button onclick="stepForward()" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 rounded text-[10px] transition font-bold text-white">Forward</button>
                <button onclick="resetCircuit()" class="px-3 py-1 bg-rose-900/40 border border-rose-800 rounded text-[10px] transition text-rose-200 ml-2">Clear</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-12 lg:col-span-3 space-y-3">
                <!-- Advanced Dynamic Insights Panel -->
                <section class="insight-card bg-slate-800/90 p-4 rounded-r-lg border border-slate-700 shadow-2xl overflow-hidden">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-[11px] font-bold text-sky-400 uppercase tracking-widest flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                            </svg>
                            Live Interpretation
                        </h2>
                        <span id="insight-gate-tag" class="text-[9px] bg-sky-900/50 text-sky-200 px-2 py-0.5 rounded border border-sky-700">NONE</span>
                    </div>
                    <div id="insight-content" class="text-xs leading-relaxed text-slate-200 space-y-3">
                        <p class="text-slate-400 italic">Drag a gate onto a qubit line to see how it transforms the quantum state.</p>
                    </div>
                </section>

                <section class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Gates</h2>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button draggable="true" ondragstart="handleDragStart(event, 'H')" class="gate-btn bg-indigo-600 py-2 rounded text-[10px] font-bold shadow-lg">H</button>
                        <button draggable="true" ondragstart="handleDragStart(event, 'X')" class="gate-btn bg-emerald-600 py-2 rounded text-[10px] font-bold shadow-lg">X</button>
                        <button draggable="true" ondragstart="handleDragStart(event, 'Y')" class="gate-btn bg-emerald-700 py-2 rounded text-[10px] font-bold shadow-lg">Y</button>
                        <button draggable="true" ondragstart="handleDragStart(event, 'Z')" class="gate-btn bg-emerald-800 py-2 rounded text-[10px] font-bold shadow-lg">Z</button>
                        <button draggable="true" ondragstart="handleDragStart(event, 'S')" class="gate-btn bg-amber-600 py-2 rounded text-[10px] font-bold shadow-lg">S</button>
                        <button draggable="true" ondragstart="handleDragStart(event, 'T')" class="gate-btn bg-amber-700 py-2 rounded text-[10px] font-bold shadow-lg">T</button>
                        <button draggable="true" ondragstart="handleDragStart(event, 'CNOT')" class="gate-btn bg-rose-600 py-2 rounded text-[10px] font-bold col-span-2 shadow-lg">CNOT</button>
                    </div>
                </section>
                
                <section class="bg-slate-800 p-3 rounded-xl border border-slate-700 overflow-y-auto max-h-[300px]">
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase mb-2">Populations</h2>
                    <div id="probabilities-list" class="space-y-1 text-[10px] font-mono"></div>
                </section>
            </div>

            <div class="col-span-12 lg:col-span-9 space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 overflow-x-auto">
                    <div id="circuit-rows" class="space-y-2 relative py-2"></div>
                </div>

                <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 min-h-[450px] relative">
                    <div id="view-circuit" class="view-panel grid grid-cols-4 sm:grid-cols-8 gap-4"></div>

                    <div id="view-corkscrew" class="view-panel hidden relative">
                        <div id="three-corkscrew-container" class="w-full h-[400px]"></div>
                    </div>

                    <div id="view-qsphere" class="view-panel hidden relative">
                        <div id="three-qsphere-container" class="w-full h-[400px]"></div>
                    </div>

                    <div id="view-hinton" class="view-panel hidden">
                        <div class="flex flex-col xl:flex-row gap-8 items-start justify-center">
                            <div class="flex-shrink-0">
                                <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase text-center">Density Matrix ($\rho$)</h3>
                                <div class="hinton-wrapper mx-auto">
                                    <div id="hinton-top-labels" class="hinton-top-labels"></div>
                                    <div id="hinton-left-labels" class="hinton-left-labels"></div>
                                    <div id="hinton-container" class="hinton-grid"></div>
                                </div>
                            </div>
                            <div class="flex-grow w-full max-w-[500px]">
                                <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase text-center">Local Qubit States</h3>
                                <div id="polytope-container" class="grid grid-cols-2 gap-4"></div>
                            </div>
                        </div>
                    </div>

                    <div id="view-matrix" class="view-panel hidden space-y-6">
                        <div class="flex flex-wrap gap-8">
                            <div class="flex-1 min-w-[200px]">
                                <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">State Vector |ψ⟩</h3>
                                <div class="bracket-container p-3 bg-slate-950 rounded-lg w-full">
                                    <div class="bracket-left"></div>
                                    <div id="vector-display" class="grid grid-cols-1 gap-x-4 w-full px-2"></div>
                                    <div class="bracket-right"></div>
                                </div>
                            </div>
                            <div class="flex-1 min-w-[200px]">
                                <h3 id="matrix-title" class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Gate Matrix</h3>
                                <div class="bracket-container bg-slate-950 p-1 rounded-lg border border-slate-800 w-full">
                                    <div class="bracket-left"></div>
                                    <div class="matrix-scroll-wrapper w-full">
                                        <div id="matrix-display" class="matrix-grid"></div>
                                    </div>
                                    <div class="bracket-right"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="disk-template">
        <div class="flex flex-col items-center">
            <div class="phase-disk w-12 h-12 mb-1 shadow-inner">
                <div class="phase-fill"></div>
                <div class="phase-needle"></div>
            </div>
            <div class="text-[8px] font-mono text-slate-500 state-label">|0000⟩</div>
        </div>
    </template>

    <script>
        class Complex {
            constructor(re, im = 0) { this.re = re; this.im = im; }
            add(o) { return new Complex(this.re + o.re, this.im + o.im); }
            sub(o) { return new Complex(this.re - o.re, this.im - o.im); }
            mul(o) { return new Complex(this.re * o.re - this.im * o.im, this.re * o.im + this.im * o.re); }
            magSq() { return this.re * this.re + this.im * this.im; }
            mag() { return Math.sqrt(this.magSq()); }
            phase() { return Math.atan2(this.im, this.re); }
            toString() { 
                if (this.magSq() < 1e-6) return "0";
                const r = this.re.toFixed(2);
                const i = Math.abs(this.im).toFixed(2);
                if (Math.abs(this.im) < 1e-4) return r;
                if (Math.abs(this.re) < 1e-4) return (this.im < 0 ? '-' : '') + i + "i";
                return `${r}${this.im >= 0 ? '+' : '-'}${i}i`;
            }
        }

        const QUBITS = 4;
        const STATES = 16;
        let circuit = [];
        let currentStep = 0;
        let stateVector = Array(STATES).fill(0).map(() => new Complex(0, 0));
        let activeTab = 'circuit';
        let animationTime = 0;

        let corkscrew = { scene: null, camera: null, renderer: null, controls: null, lines: [], labels: [], needles: [], compositeLine: null };
        let qsphere = { scene: null, camera: null, renderer: null, controls: null, nodes: [], labels: [] };
        let polytopeViews = [];

        function switchTab(tabId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
            activeTab = tabId;
            
            setTimeout(() => {
                if (tabId === 'corkscrew') initCorkscrew();
                if (tabId === 'qsphere') initQSphere();
                if (tabId === 'hinton') { initPolytopeView(); initHintonLabels(); }
                runSimulation();
            }, 50);
        }

        function runSimulation() {
            stateVector = Array(STATES).fill(0).map(() => new Complex(0, 0));
            stateVector[0] = new Complex(1, 0);
            const INV_SQRT2 = 1 / Math.sqrt(2);
            let lastMatrix = null;
            let lastGateInfo = "None";

            for (let s = 0; s < currentStep; s++) {
                const gate = circuit[s];
                const nextState = Array(STATES).fill(0).map(() => new Complex(0, 0));
                const bitMask = 1 << (3 - gate.target);
                
                if (s === currentStep - 1) {
                    lastMatrix = Array(STATES).fill(0).map(() => Array(STATES).fill(new Complex(0,0)));
                    lastGateInfo = `${gate.type} on Q${gate.target}`;
                }

                for (let i = 0; i < STATES; i++) {
                    const amp = stateVector[i];
                    const bitIsSet = (i & bitMask) !== 0;
                    const ctrlSatisfied = gate.controls.every(c => (i & (1 << (3 - c))) !== 0);

                    if (gate.type === 'H') {
                        const idx0 = i & ~bitMask;
                        const idx1 = i | bitMask;
                        if (!bitIsSet) {
                            nextState[idx0] = nextState[idx0].add(amp.mul(new Complex(INV_SQRT2)));
                            nextState[idx1] = nextState[idx1].add(amp.mul(new Complex(INV_SQRT2)));
                            if (lastMatrix) { lastMatrix[idx0][i] = new Complex(INV_SQRT2); lastMatrix[idx1][i] = new Complex(INV_SQRT2); }
                        } else {
                            nextState[idx0] = nextState[idx0].add(amp.mul(new Complex(INV_SQRT2)));
                            nextState[idx1] = nextState[idx1].add(amp.mul(new Complex(-INV_SQRT2)));
                            if (lastMatrix) { lastMatrix[idx0][i] = new Complex(INV_SQRT2); lastMatrix[idx1][i] = new Complex(-INV_SQRT2); }
                        }
                    } else if (gate.type === 'X' || (gate.type === 'CNOT')) {
                        const target = ctrlSatisfied ? i ^ bitMask : i;
                        nextState[target] = nextState[target].add(amp);
                        if (lastMatrix) lastMatrix[target][i] = new Complex(1);
                    } else if (gate.type === 'Y') {
                        const target = ctrlSatisfied ? i ^ bitMask : i;
                        const phase = (ctrlSatisfied && bitIsSet) ? new Complex(0, -1) : (ctrlSatisfied ? new Complex(0, 1) : new Complex(1));
                        nextState[target] = nextState[target].add(amp.mul(phase));
                        if (lastMatrix) lastMatrix[target][i] = phase;
                    } else if (gate.type === 'Z') {
                        const phase = (ctrlSatisfied && bitIsSet) ? new Complex(-1) : new Complex(1);
                        nextState[i] = nextState[i].add(amp.mul(phase));
                        if (lastMatrix) lastMatrix[i][i] = phase;
                    } else if (gate.type === 'S') {
                        const phase = bitIsSet ? new Complex(0, 1) : new Complex(1);
                        nextState[i] = nextState[i].add(amp.mul(phase));
                        if (lastMatrix) lastMatrix[i][i] = phase;
                    } else if (gate.type === 'T') {
                        const phase = bitIsSet ? new Complex(Math.SQRT1_2, Math.SQRT1_2) : new Complex(1);
                        nextState[i] = nextState[i].add(amp.mul(phase));
                        if (lastMatrix) lastMatrix[i][i] = phase;
                    }
                }
                stateVector = nextState;
            }
            updateViews(lastMatrix, lastGateInfo);
            updateInsights();
        }

        function updateInsights() {
            const container = document.getElementById('insight-content');
            const tag = document.getElementById('insight-gate-tag');
            const lastGate = circuit[currentStep - 1];
            
            if (currentStep === 0) {
                tag.innerText = "START";
                container.innerHTML = `<p>The system is in the ground state <b>|0000⟩</b>. Every qubit is a definite '0'. Apply an <b>H (Hadamard)</b> gate to see superposition begin.</p>`;
                return;
            }

            tag.innerText = lastGate.type + (lastGate.controls.length > 0 ? "*" : "");
            
            let message = "";
            const probCount = stateVector.filter(v => v.magSq() > 0.01).length;

            switch(activeTab) {
                case 'circuit':
                    if (lastGate.type === 'H') {
                        message = `<p><b>Hadamard (H) Applied:</b> Notice how the phase disks are now splitting. Instead of one large blue circle, you have two smaller ones. Each represents a 50% probability of finding that state.</p>`;
                    } else if (lastGate.type === 'X') {
                        message = `<p><b>NOT (X) Applied:</b> Look at the binary labels. The gate flipped the ${lastGate.target}-th bit. The probability "mass" has shifted to the corresponding binary state.</p>`;
                    } else {
                        message = `<p><b>${lastGate.type} Applied:</b> This rotation adjusted the complex phase. Watch the <b>needle</b> inside the disk; it points in a different direction now, representing a phase shift.</p>`;
                    }
                    break;

                case 'corkscrew':
                    if (probCount > 1) {
                        message = `<p><b>Wave Superposition:</b> Look at the <b>White Composite Wave</b> on the far left. It is the sum of all individual basis waves. Notice how it creates a unique interference pattern.</p>
                                   <p class="mt-2">The <b>colored spirals</b> represent different outcomes. Because you applied ${lastGate.type}, these waves are now interacting. If they were 180° apart, they would cancel out (destructive interference).</p>`;
                    } else {
                        message = `<p><b>Pure State:</b> Since there is only one outcome, the white composite wave matches the basis wave exactly. There is no interference to observe yet.</p>`;
                    }
                    break;

                case 'qsphere':
                    message = `<p>The <b>Q-Sphere</b> is now showing <b>${probCount}</b> active nodes. Since you applied ${lastGate.type}, focus on the <b>colors</b>.</p>
                               <p class="mt-2">Different colors mean different relative phases. If all nodes were the same color, they would be "in phase". Here, the gate has likely introduced a phase rotation.</p>`;
                    break;

                case 'hinton':
                    const p1 = parseFloat(polytopeViews[0]?.purityText.innerText.match(/(\d+)%/)?.[1] || 100);
                    if (p1 < 90) {
                        message = `<p><b>Entanglement Detected!</b> Look at the <b>Polytopes (Bloch Spheres)</b>. Notice they are no longer on the surface of the sphere—they have <b>shrunk toward the center</b>.</p>
                                   <p class="mt-2">This means the qubits no longer have a definite state of their own; they only exist as part of a correlated pair. The <b>Hinton Diagram</b> on the left shows off-diagonal colored squares—these represent the "coherence" or link between these states.</p>`;
                    } else {
                        message = `<p><b>Independent States:</b> The qubits are still "pure". In the Hinton Diagram, focus on the <b>Diagonal</b>. These large squares show where the probability lives. Since there are no off-diagonal connections, there is no entanglement yet.</p>`;
                    }
                    break;

                case 'matrix':
                    message = `<p>Focus on the <b>Matrix Grid</b>. Each column represents what happens to a specific basis state (like |0000⟩) when the ${lastGate.type} gate hits it.</p>
                               <p class="mt-2">The <b>State Vector</b> on the left shows the resulting coefficients. Any complex numbers (with an 'i') mean the gate pushed the state into the complex plane.</p>`;
                    break;
            }

            container.innerHTML = message;
        }

        function createTextSprite(text, color = '#94a3b8') {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128; canvas.height = 64;
            ctx.fillStyle = color; ctx.font = 'Bold 32px monospace'; ctx.textAlign = 'center';
            ctx.fillText(text, 64, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(1.2, 0.6, 1);
            return sprite;
        }

        function initCorkscrew() {
            const container = document.getElementById('three-corkscrew-container');
            if (corkscrew.renderer) {
                corkscrew.renderer.setSize(container.clientWidth, container.clientHeight);
                return;
            }
            corkscrew.scene = new THREE.Scene();
            corkscrew.camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.1, 1000);
            corkscrew.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            corkscrew.renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(corkscrew.renderer.domElement);
            corkscrew.controls = new THREE.OrbitControls(corkscrew.camera, corkscrew.renderer.domElement);
            corkscrew.camera.position.set(0, 8, 14);

            const gridHelper = new THREE.GridHelper(24, 24, 0x1e293b, 0x1e293b);
            gridHelper.position.y = -0.1;
            corkscrew.scene.add(gridHelper);

            for(let i=0; i<STATES; i++) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(100 * 3);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 }));
                corkscrew.scene.add(line);
                corkscrew.lines.push(line);

                const needleGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0)]);
                const needle = new THREE.Line(needleGeom, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
                corkscrew.scene.add(needle);
                corkscrew.needles.push(needle);

                const label = createTextSprite(`|${i.toString(2).padStart(4,'0')}⟩`);
                label.position.set(i - 7.5, 0, -1);
                corkscrew.scene.add(label);
                corkscrew.labels.push(label);
            }

            const compositeGeom = new THREE.BufferGeometry();
            compositeGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(100*3), 3));
            corkscrew.compositeLine = new THREE.Line(compositeGeom, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 }));
            corkscrew.scene.add(corkscrew.compositeLine);
        }

        function renderCorkscrew() {
            if (!corkscrew.renderer) return;
            const compositePoints = new Array(100).fill(0).map(() => new Complex(0,0));
            const BASE_RADIUS = 2.5;

            stateVector.forEach((amp, idx) => {
                const prob = amp.magSq();
                const line = corkscrew.lines[idx];
                const needle = corkscrew.needles[idx];
                const label = corkscrew.labels[idx];
                if (!line) return;
                
                if (prob < 0.001) { 
                    line.visible = false; 
                    needle.visible = false;
                    label.material.opacity = 0.1; 
                    return; 
                }

                line.visible = true;
                needle.visible = true;
                label.material.opacity = 1;
                
                const pos = line.geometry.attributes.position.array;
                const phase0 = amp.phase();
                const radius = Math.sqrt(prob) * BASE_RADIUS;
                
                line.material.color.setHSL(idx / STATES, 0.8, 0.5);

                for(let i=0; i<100; i++) {
                    const t = i / 10;
                    const angle = phase0 + (t * 1.5) - animationTime;
                    const x = idx - 7.5;
                    const y = Math.sin(angle) * radius;
                    const z = t;
                    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
                    compositePoints[i] = compositePoints[i].add(new Complex(Math.cos(angle)*radius, Math.sin(angle)*radius));
                }
                line.geometry.attributes.position.needsUpdate = true;
                needle.position.set(idx-7.5, 0, 0);
                needle.scale.y = radius;
                needle.rotation.x = -phase0 + animationTime;
            });

            const cPos = corkscrew.compositeLine.geometry.attributes.position.array;
            for(let i=0; i<100; i++) {
                const t = i / 10;
                cPos[i*3] = -9.5;
                cPos[i*3+1] = compositePoints[i].re;
                cPos[i*3+2] = t;
            }
            corkscrew.compositeLine.geometry.attributes.position.needsUpdate = true;
            corkscrew.renderer.render(corkscrew.scene, corkscrew.camera);
        }

        function initQSphere() {
            const container = document.getElementById('three-qsphere-container');
            if (qsphere.renderer) {
                qsphere.renderer.setSize(container.clientWidth, container.clientHeight);
                return;
            }
            qsphere.scene = new THREE.Scene();
            qsphere.camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.1, 1000);
            qsphere.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            qsphere.renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(qsphere.renderer.domElement);
            qsphere.controls = new THREE.OrbitControls(qsphere.camera, qsphere.renderer.domElement);
            qsphere.camera.position.set(6, 6, 6);
            
            const grid = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.05 }));
            qsphere.scene.add(grid);

            for(let i=0; i<STATES; i++) {
                const node = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                const hamming = i.toString(2).split('1').length - 1;
                const phi = (hamming / QUBITS) * Math.PI;
                const theta = (i / STATES) * Math.PI * 2;
                node.position.set(4 * Math.sin(phi) * Math.cos(theta), 4 * Math.cos(phi), 4 * Math.sin(phi) * Math.sin(theta));
                qsphere.scene.add(node);
                qsphere.nodes.push(node);
                const label = createTextSprite(`|${i.toString(2).padStart(4,'0')}⟩`);
                label.position.copy(node.position).multiplyScalar(1.2);
                qsphere.scene.add(label);
                qsphere.labels.push(label);
            }
        }

        function renderQSphere() {
            if (!qsphere.renderer) return;
            stateVector.forEach((amp, i) => {
                const prob = amp.magSq();
                const node = qsphere.nodes[i];
                const label = qsphere.labels[i];
                if (!node) return;
                if (prob < 0.001) {
                    node.scale.setScalar(0.2);
                    node.material.color.setHex(0x1e293b);
                    label.visible = false;
                } else {
                    const s = 0.2 + Math.sqrt(prob) * 2.5;
                    node.scale.setScalar(s);
                    node.material.color.setHSL(amp.phase()/(2*Math.PI) + 0.5, 0.8, 0.5);
                    label.visible = true;
                }
            });
            qsphere.renderer.render(qsphere.scene, qsphere.camera);
        }

        function initPolytopeView() {
            const container = document.getElementById('polytope-container');
            if (!container || polytopeViews.length > 0) return;
            container.innerHTML = '';
            polytopeViews = [];

            for(let q=0; q<QUBITS; q++) {
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-2 rounded-lg border border-slate-700 flex flex-col items-center min-h-[140px]";
                card.innerHTML = `<h4 class="text-[9px] font-bold text-slate-400 mb-1">Q${q}</h4><div id="poly-${q}" class="w-full h-24 block"></div><div class="purity-val text-[8px] text-sky-400 mt-1"></div>`;
                container.appendChild(card);

                const viewContainer = card.querySelector(`#poly-${q}`);
                const w = viewContainer.clientWidth || 180, h = viewContainer.clientHeight || 100;
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(w, h);
                viewContainer.appendChild(renderer.domElement);
                camera.position.set(2, 2, 4);
                camera.lookAt(0,0,0);

                const bloch = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 12), new THREE.MeshBasicMaterial({ color: 0x475569, wireframe: true, transparent: true, opacity: 0.1 }));
                scene.add(bloch);

                const statePoint = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
                scene.add(statePoint);
                const traceLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color: 0x38bdf8, transparent: true, opacity: 0.7}));
                scene.add(traceLine);

                polytopeViews.push({ scene, camera, renderer, viewContainer, statePoint, traceLine, purityText: card.querySelector('.purity-val') });
            }
        }

        function initHintonLabels() {
            const top = document.getElementById('hinton-top-labels');
            const left = document.getElementById('hinton-left-labels');
            if (!top || !left || top.children.length > 0) return;
            for(let i=0; i<STATES; i++) {
                const b = i.toString(2).padStart(4, '0');
                const tL = document.createElement('div'); tL.className = "hinton-label col"; tL.innerText = b; top.appendChild(tL);
                const lL = document.createElement('div'); lL.className = "hinton-label row"; lL.innerText = b; left.appendChild(lL);
            }
        }

        function updatePolytopeView() {
            polytopeViews.forEach((view, q) => {
                let p0 = 0, p1 = 0, rho01 = new Complex(0,0);
                const mask = 1 << (3-q);
                stateVector.forEach((amp, i) => { 
                    const prob = amp.magSq();
                    if (i & mask) p1 += prob; else {
                        p0 += prob;
                        const i1 = i | mask;
                        rho01 = rho01.add(amp.mul(new Complex(stateVector[i1].re, -stateVector[i1].im)));
                    }
                });
                const x = 2 * rho01.re, y = 2 * rho01.im, z = p0 - p1;
                const r = Math.sqrt(x*x + y*y + z*z);
                view.statePoint.position.set(x, z, y);
                view.traceLine.geometry.setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(x, z, y)]);
                view.purityText.innerText = `Purity: ${((1+r*r)/2*100).toFixed(0)}% | R: ${r.toFixed(2)}`;
                view.scene.rotation.y += 0.005;
                view.renderer.render(view.scene, view.camera);
            });
        }

        function updateViews(lastMatrix, lastGateInfo) {
            updateCircuitView();
            updateMatrixDisplay(lastMatrix, lastGateInfo);
            updateHintonView();
            updatePolytopeView();
            const list = document.getElementById('probabilities-list');
            if(list) {
                list.innerHTML = stateVector.map((amp, i) => {
                    const prob = amp.magSq();
                    return prob > 0.001 ? `<div class="flex justify-between p-1 bg-slate-900/50 border-l-2 border-sky-500 rounded"><span>|${i.toString(2).padStart(4,'0')}⟩</span><span class="text-sky-400 font-bold">${(prob*100).toFixed(1)}%</span></div>` : '';
                }).join('');
            }
        }

        function updateCircuitView() {
            stateVector.forEach((amp, i) => {
                const disk = document.getElementById(`disk-${i}`);
                if (!disk) return;
                const prob = amp.magSq();
                const fill = disk.querySelector('.phase-fill');
                const needle = disk.querySelector('.phase-needle');
                fill.style.width = fill.style.height = `${Math.sqrt(prob) * 100}%`;
                needle.style.transform = `rotate(${-amp.phase()}rad)`;
                needle.style.opacity = prob > 0.001 ? 1 : 0.1;
                disk.parentElement.style.opacity = prob > 0.001 ? 1 : 0.3;
            });
            renderCircuitLines();
        }

        function updateMatrixDisplay(matrix, info) {
            const vecDiv = document.getElementById('vector-display');
            const matDiv = document.getElementById('matrix-display');
            const title = document.getElementById('matrix-title');
            if (title) title.innerText = info ? `${info} Matrix` : "Gate Matrix";
            
            if (vecDiv) {
                vecDiv.innerHTML = stateVector.map((v, i) => `
                    <div class="flex justify-between text-[10px] font-mono py-0.5 border-b border-slate-800/50">
                        <span class="text-slate-500">|${i.toString(2).padStart(4,'0')}⟩</span>
                        <span class="${v.magSq() > 0 ? 'text-sky-400 font-bold' : 'text-slate-700'}">${v.toString()}</span>
                    </div>`).join('');
            }

            if (matDiv) {
                matDiv.innerHTML = '';
                for(let r=0; r<STATES; r++) {
                    for(let c=0; c<STATES; c++) {
                        const cell = document.createElement('div');
                        const val = matrix ? matrix[r][c] : (r===c ? new Complex(1) : new Complex(0));
                        cell.className = `matrix-cell ${val.magSq() > 0 ? 'text-sky-300 font-bold bg-sky-900/20' : 'text-slate-800'}`;
                        cell.innerText = val.toString() === "0" ? "·" : val.toString();
                        matDiv.appendChild(cell);
                    }
                }
            }
        }

        function updateHintonView() {
            const hinton = document.getElementById('hinton-container');
            if (!hinton) return;
            hinton.innerHTML = '';
            for(let i=0; i<STATES; i++) {
                for(let j=0; j<STATES; j++) {
                    const val = stateVector[i].mul(new Complex(stateVector[j].re, -stateVector[j].im));
                    const magnitude = val.mag();
                    const cell = document.createElement('div');
                    cell.className = "bg-slate-950 flex items-center justify-center";
                    if (magnitude > 0.001) {
                        const inner = document.createElement('div');
                        inner.className = "rounded-[1px]";
                        inner.style.width = inner.style.height = (Math.sqrt(magnitude) * 16) + 'px';
                        inner.style.backgroundColor = `hsl(${(val.phase() / (2 * Math.PI) * 360) + 180}, 80%, 50%)`;
                        cell.appendChild(inner);
                    }
                    hinton.appendChild(cell);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            animationTime += 0.05;
            if (activeTab === 'corkscrew') renderCorkscrew();
            if (activeTab === 'qsphere') renderQSphere();
            if (activeTab === 'hinton') updatePolytopeView();
        }

        function init() {
            const container = document.getElementById('view-circuit');
            const diskTemplate = document.getElementById('disk-template');
            if(container && diskTemplate) {
                for (let i = 0; i < STATES; i++) {
                    const clone = diskTemplate.content.cloneNode(true);
                    clone.querySelector('.phase-disk').id = `disk-${i}`;
                    clone.querySelector('.state-label').innerText = `|${i.toString(2).padStart(4, '0')}⟩`;
                    container.appendChild(clone);
                }
            }
            const circuitRows = document.getElementById('circuit-rows');
            if (circuitRows) {
                for (let i = 0; i < QUBITS; i++) {
                    const row = document.createElement('div');
                    row.className = "relative h-8 flex items-center";
                    row.innerHTML = `<span class="absolute -left-8 text-[10px] font-bold text-slate-500">Q${i}</span><div class="qubit-line"></div><div id="row-${i}" class="gate-row flex gap-4 px-4 w-full h-full items-center relative z-10"></div>`;
                    circuitRows.appendChild(row);
                    const finalR = document.getElementById(`row-${i}`);
                    finalR.addEventListener('dragover', e => { e.preventDefault(); finalR.classList.add('drag-over'); });
                    finalR.addEventListener('dragleave', () => finalR.classList.remove('drag-over'));
                    finalR.addEventListener('drop', e => handleDrop(e, i));
                }
            }
            animate();
            runSimulation();
        }

        function renderCircuitLines() {
            for (let q = 0; q < QUBITS; q++) {
                const row = document.getElementById(`row-${q}`);
                if(!row) continue;
                row.innerHTML = '';
                circuit.forEach((gate, idx) => {
                    const gEl = document.createElement('div');
                    const isActive = idx < currentStep;
                    gEl.className = `w-7 h-7 flex items-center justify-center rounded cursor-pointer transition-all shrink-0 z-20 shadow-md`;
                    if (!isActive) gEl.classList.add('opacity-10');
                    if (idx === currentStep - 1) gEl.classList.add('active-gate');

                    if (gate.target === q) {
                        gEl.innerText = gate.type;
                        gEl.classList.add(...getGateColor(gate.type).split(' '), 'text-white', 'font-bold', 'text-[9px]');
                        gEl.onclick = () => { circuit.splice(idx, 1); currentStep = Math.min(currentStep, circuit.length); runSimulation(); };
                    } else if (gate.controls.includes(q)) {
                        gEl.innerHTML = '<div class="w-2.5 h-2.5 bg-white rounded-full"></div>';
                    } else {
                        gEl.className = 'w-7 h-7 flex items-center justify-center opacity-5 z-20';
                        gEl.innerHTML = '<div class="w-full h-px bg-white"></div>';
                    }
                    row.appendChild(gEl);
                });
            }
        }

        function handleDragStart(e, type) { e.dataTransfer.setData("text", type); }
        function handleDrop(e, q) {
            e.preventDefault();
            const type = e.dataTransfer.getData("text");
            if(!type) return;
            let controls = [];
            if (type === 'CNOT') {
                const c = prompt("Control Qubit (0-3):", "0");
                if (c === null || isNaN(parseInt(c)) || parseInt(c) === q) return;
                controls = [parseInt(c)];
            }
            circuit.push({ type, target: q, controls });
            currentStep = circuit.length;
            runSimulation();
        }

        function getGateColor(t) { 
            if (t === 'H') return 'bg-indigo-600';
            if (['X','Y','Z'].includes(t)) return 'bg-emerald-600';
            if (['S','T'].includes(t)) return 'bg-amber-600';
            return 'bg-rose-600'; 
        }
        function stepForward() { if(currentStep < circuit.length) { currentStep++; runSimulation(); } }
        function stepBack() { if(currentStep > 0) { currentStep--; runSimulation(); } }
        function resetStep() { currentStep = 0; runSimulation(); }
        function resetCircuit() { circuit = []; currentStep = 0; runSimulation(); }

        window.onload = init;
    </script>
</body>
</html>
